[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-atac"
version = "0.1.0"
description = "Place paired multiome ATAC profiles on a spatial RNA spot grid"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "anndata>=0.9",
  "magic-impute>=3.0",
  "numpy>=1.23",
  "pandas>=1.5",
  "scanpy>=1.9",
  "scipy>=1.9",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

